<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricsFinder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Sprachumschaltung-->
    <div class="lang-switch">
        <button id="langToogleBtn" onclick="toogleLanguage()">DE / EN</button>
    </div>


    <!-- Discord Button Oben Links -->
    <a href="https://discord.gg/bhyqq4D9Ab" target="_blank" rel="noopener" class="discord-link" title="Discord (Soon)">
        <svg class="discord-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36" aria-hidden="true">
            <path fill="currentColor" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.68 1.76 1.36 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45 65.69c-6.32 0-11.51-5.8-11.51-12.92s5.08-12.92 11.51-12.92c6.48 0 11.62 5.86 11.51 12.92 0 7.12-5.08 12.92-11.51 12.92Zm42.24 0c-6.32 0-11.51-5.8-11.51-12.92s5.08-12.92 11.51-12.92c6.48 0 11.62 5.86 11.51 12.92 0 7.12-5.03 12.92-11.51 12.92Z"/>
        </svg>
    </a>

    
      <main class="main-content">
        <!-- Header-Bereich mit Logo und Name -->
        <header class="header-container">
            <img src="/static/logo2.png" alt="LyricsFinder Logo">
            <h1>LyricsFinder</h1>
        </header>

        <p class="P1">Just type the text in your head into the searchbar and click "Search"</p>
        <p class="P1">It can take a few seconds to do research</p>

        <!-- Suchbereich -->
        <div class="search-box">
            <form id="searchForm">
                <!-- LINKS: Sprachfilter mit erweiterten Sprachen -->
                <div class="Filter-Sprache">
                    <select id="language" name="language">
                        <option value="all">All Languages</option>
                        <option value="en">English</option>
                        <option value="de">German</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="nl">Dutch</option>
                        <option value="tr">Turkish</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>

                <!-- MITTE: Textfeld -->
                <input type="text" id="query" placeholder="Type your line" aria-label="Search lyrics" required>

                <!-- RECHTS: Suchen Button -->
                <button type="submit">Search</button>
            </form>
        </div>

        <!-- Suchergebnisse Grid -->
        <div class="results" id="results"></div>
    </main>

    <!-- Footer-Bereich -->
    <footer>
        <div class="footer-left">
            <p>&copy; 2026 Luca-Romeo Lotzkat. All rights reserved.</p>
            <p>Data powered by <a href="https://developer.spotify.com" target="_blank" rel="noopener">Spotify API</a> &amp; <a href="https://genius.com" target="_blank" rel="noopener">Genius API</a>.</p>
            <p>This Website is not from Spotify itself</p>
        </div>
        
        <div class="footer-right">
            <a href="/datenschutz">Privacy Policy</a>
            <a href="/impressum">Legal notice</a>
        </div>
    </footer>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value.trim();
            const language = document.getElementById('language').value;
            const container = document.getElementById('results');

            if (!query) return;

            container.innerHTML = `
                <div class="loading-dots">
                    Searching<span></span><span></span><span></span>
                </div>
            `;

            const formData = new FormData();
            formData.append('query', query);
            formData.append('language', language);

            try {
                const response = await fetch('/search', { 
                    method: 'POST', 
                    body: formData 
                });

                if (!response.ok) {
                    throw new Error('Serverfehler');
                }

                const data = await response.json();
                container.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = '<p style="color: #b3b3b3;">Keine Ergebnisse gefunden.</p>';
                    return;
                }

                // Prüfen, ob bei den Treffern ein Sprach-Mismatch vorliegt
                const hasMismatch = data.results.some(item => item.language_mismatch);

                if (hasMismatch) {
                    container.innerHTML = `
                        <p style="color: #ffcc00; font-weight: bold; background: rgba(255, 204, 0, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #ffcc00;">
                            Search could not be completed because the languages do not match. Please set the language filter to All Languages.
                        </p>
                    `;
                    return;
                }

                data.results.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <a href="${item.spotify_url}" target="_blank" rel="noopener">
                            <img src="${item.cover}" alt="${item.title}">
                        </a>
                        <h3>${item.title}</h3>
                        <p>${item.artist}</p>
                        ${item.preview ? `<audio controls src="${item.preview}" style="width: 100%; margin: 10px 0;"></audio>` : ''}
                        
                        <a href="${item.spotify_url}" target="_blank" rel="noopener" style="color: #1db954; font-weight: bold; margin-bottom: 8px; display: inline-block;">
                            Open with Spotify
                        </a>
                        <br>
                        <a href="${item.genius_url}" target="_blank" rel="noopener" style="color: #b3b3b3; font-size: 13px;">Show Lyrics on Genius</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Fehler bei der Suche:', error);
                container.innerHTML = '<p style="color: #ff5555;">Error during search. Please try again.</p>';
            }
        });
    </script>

    <script>
        // Übersetzungswörterbuch für DE / EN
        const translations = {
            de: {
                p1: "Gib einfach den Text aus deinem Kopf in die Suchleiste ein und klicke auf \"Suchen\"",
                p2: "Die Recherche kann einige Sekunden dauern",
                placeholder: "Textzeile eingeben",
                searchBtn: "Suchen",
                searching: "Suche läuft",
                noResults: "Keine Ergebnisse gefunden.",
                mismatchError: "Die Suche konnte nicht durchgeführt werden, da die Sprachen nicht übereinstimmen. Bitte stelle den Sprachfilter auf Alle Sprachen.",
                openSpotify: "Auf Spotify öffnen",
                showGenius: "Songtext auf Genius anzeigen",
                serverError: "Fehler bei der Suche. Bitte versuche es erneut.",
                btnText: "DE / EN",
                privacyPolicy: "Datenschutzerklärung",
                legalNotice: "Impressum",
                optAll: "Alle Sprachen",
                optEn: "Englisch",
                optDe: "Deutsch",
                optFr: "Französisch",
                optEs: "Spanisch",
                optIt: "Italienisch",
                optPt: "Portugiesisch",
                optNl: "Niederländisch",
                optTr: "Türkisch",
                optRu: "Russisch"
            },
            en: {
                p1: "Just type the text in your head into the searchbar and click \"Search\"",
                p2: "It can take a few seconds to do research",
                placeholder: "Type your line",
                searchBtn: "Search",
                searching: "Searching",
                noResults: "No results found.",
                mismatchError: "Search could not be completed because the languages do not match. Please set the language filter to All Languages.",
                openSpotify: "Open with Spotify",
                showGenius: "Show Lyrics on Genius",
                serverError: "Error during search. Please try again.",
                btnText: "EN / DE",
                privacyPolicy: "Privacy Policy",
                legalNotice: "Legal notice",
                optAll: "All Languages",
                optEn: "English",
                optDe: "German",
                optFr: "French",
                optEs: "Spanish",
                optIt: "Italian",
                optPt: "Portuguese",
                optNl: "Dutch",
                optTr: "Turkish",
                optRu: "Russian"
            }
        };

        // Standardmäßig auf DE
        let currentLang = 'de';

        function toogleLanguage() {
            currentLang = currentLang === 'de' ? 'en' : 'de';
            const t = translations[currentLang];

            // HTML-Lang-Attribut aktualisieren
            document.documentElement.lang = currentLang;

            // Untertitel aktualisieren
            const pElements = document.querySelectorAll('.P1');
            if (pElements.length >= 2) {
                pElements[0].textContent = t.p1;
                pElements[1].textContent = t.p2;
            }

            // Input Placeholder & Search Button
            document.getElementById('query').placeholder = t.placeholder;
            document.querySelector('#searchForm button').textContent = t.searchBtn;

            // Toggle Button Text
            document.getElementById('langToogleBtn').textContent = t.btnText;

            // Footer Links übersetzen
            const footerLinks = document.querySelectorAll('.footer-right a');
            if (footerLinks.length >= 2) {
                footerLinks[0].textContent = t.privacyPolicy;
                footerLinks[1].textContent = t.legalNotice;
            }

            // Dropdown-Optionen übersetzen
            const select = document.getElementById('language');
            if (select) {
                select.querySelector('option[value="all"]').textContent = t.optAll;
                select.querySelector('option[value="en"]').textContent = t.optEn;
                select.querySelector('option[value="de"]').textContent = t.optDe;
                select.querySelector('option[value="fr"]').textContent = t.optFr;
                select.querySelector('option[value="es"]').textContent = t.optEs;
                select.querySelector('option[value="it"]').textContent = t.optIt;
                select.querySelector('option[value="pt"]').textContent = t.optPt;
                select.querySelector('option[value="nl"]').textContent = t.optNl;
                select.querySelector('option[value="tr"]').textContent = t.optTr;
                select.querySelector('option[value="ru"]').textContent = t.optRu;
            }

            // Falls aktuell eine Mismatch-Meldung angezeigt wird, diese ebenfalls übersetzen
            const mismatchBox = document.getElementById('mismatchAlert');
            if (mismatchBox) {
                mismatchBox.textContent = t.mismatchError;
            }
        }

        // Suchformular Logik
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value.trim();
            const language = document.getElementById('language').value;
            const container = document.getElementById('results');
            const t = translations[currentLang];

            if (!query) return;

            container.innerHTML = `
                <div class="loading-dots">
                    ${t.searching}<span></span><span></span><span></span>
                </div>
            `;

            const formData = new FormData();
            formData.append('query', query);
            formData.append('language', language);

            try {
                const response = await fetch('/search', { 
                    method: 'POST', 
                    body: formData 
                });

                if (!response.ok) {
                    throw new Error('Serverfehler');
                }

                const data = await response.json();
                container.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = `<p style="color: #b3b3b3;">${t.noResults}</p>`;
                    return;
                }

                // Prüfen auf Sprach-Mismatch
                const hasMismatch = data.results.some(item => item.language_mismatch);

                if (hasMismatch) {
                    container.innerHTML = `
                        <p id="mismatchAlert" style="color: #ffcc00; font-weight: bold; background: rgba(255, 204, 0, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #ffcc00;">
                            ${t.mismatchError}
                        </p>
                    `;
                    return;
                }

                data.results.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <a href="${item.spotify_url}" target="_blank" rel="noopener">
                            <img src="${item.cover}" alt="${item.title}">
                        </a>
                        <h3>${item.title}</h3>
                        <p>${item.artist}</p>
                        ${item.preview ? `<audio controls src="${item.preview}" style="width: 100%; margin: 10px 0;"></audio>` : ''}
                        
                        <a href="${item.spotify_url}" target="_blank" rel="noopener" style="color: #1db954; font-weight: bold; margin-bottom: 8px; display: inline-block;">
                            ${t.openSpotify}
                        </a>
                        <br>
                        <a href="${item.genius_url}" target="_blank" rel="noopener" style="color: #b3b3b3; font-size: 13px;">${t.showGenius}</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Fehler bei der Suche:', error);
                container.innerHTML = `<p style="color: #ff5555;">${t.serverError}</p>`;
            }
        });
    </script>
</body>
</html>
