<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c2c2c">
    <title>LyricsFinder - Download</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <style>
        /* Standalone / In-Page Styles */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .download-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Header Styling (Logo & Titel nebeneinander) */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .site-header .logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .site-header .site-title {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            color: var(--text-primary, #ffffff);
        }

        .download-card {
            background-color: var(--bg-card, #181818);
            border: 1px solid var(--border-color, #333333);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .download-card h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--text-primary, #ffffff);
        }

        .download-card p {
            color: var(--text-muted, #b3b3b3);
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .download-btn {
            background-color: var(--accent-green, #1db954);
            color: #ffffff !important;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .download-btn:hover {
            background-color: var(--accent-green-hover, #1ed760);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Sekundärer Button-Stil für Windows */
        .download-btn.windows {
            margin-top: 15px;
            background-color: #2b2d31;
            border: 1px solid #404249;
        }

        .download-btn.windows:hover {
            background-color: #35373c;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- Sprachumschaltung -->
    <div class="lang-switch">
        <button id="langToogleBtn" onclick="toogleLanguage()">DE / EN</button>
    </div>

    <!-- Discord Button Oben Links -->
    <a href="https://discord.gg/bhyqq4D9Ab" target="_blank" rel="noopener" class="discord-link" title="Discord (Soon)">
        <svg class="discord-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36" aria-hidden="true">
            <path fill="currentColor" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.68 1.76 1.36 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45 65.69c-6.32 0-11.51-5.8-11.51-12.92s5.08-12.92 11.51-12.92c6.48 0 11.62 5.86 11.51 12.92 0 7.12-5.08 12.92-11.51 12.92Zm42.24 0c-6.32 0-11.51-5.8-11.51-12.92s5.08-12.92 11.51-12.92c6.48 0 11.62 5.86 11.51 12.92 0 7.12-5.03 12.92-11.51 12.92Z"/>
        </svg>
    </a>

    <!-- Hauptbereich -->
    <main class="download-wrapper">

        <!-- Logo & Titel nebeneinander mit Verlinkung zur Startseite -->
        <header class="site-header">
            <a href="/" class="header-link">
                <img src="/static/logo2.png" alt="LyricsFinder Logo" class="logo">
                <h1 class="site-title">LyricsFinder</h1>
            </a>
        </header>

        <!-- Download Box -->
        <div class="download-card">
            <h2 id="downloadTitle">Download</h2>
            <p id="downloadDesc">Lade dir die neueste Version direkt herunter.</p>
            
            <!-- DOWNLOAD BUTTON ANDROID -->
            <a href="/download/apk" download id="downloadBtnAndroid" class="download-btn">
                Herunterladen für Android
            </a>

            <!-- DOWNLOAD BUTTON WINDOWS -->
            <a href="/download/exe" download id="downloadBtnWindows" class="download-btn windows">
                Herunterladen für Windows (W10+11)
            </a>
        </div>
    </main>

    <!-- Footer-Bereich -->
    <footer>
        <div class="footer-left">
            <p>&copy; 2026 Luca-Romeo Lotzkat. All rights reserved.</p>
            <p>Data powered by <a href="https://developer.spotify.com" target="_blank" rel="noopener">Spotify API</a> &amp; <a href="https://genius.com" target="_blank" rel="noopener">Genius API</a>.</p>
            <p>This Website is not from Spotify itself</p>
        </div>
        
        <div class="footer-right">
            <a href="/datenschutz">Datenschutzerklärung</a>
            <a href="/impressum">Impressum</a>
        </div>
    </footer>

    <script>
        const translations = {
            de: {
                title: "Download",
                desc: "Lade dir die neueste Version direkt herunter.",
                btnAndroid: "Herunterladen für Android",
                btnWindows: "Herunterladen für Windows (W10+11)",
                btnText: "DE / EN",
                privacyPolicy: "Datenschutzerklärung",
                legalNotice: "Impressum"
            },
            en: {
                title: "Download",
                desc: "Download the latest version directly.",
                btnAndroid: "Download for Android",
                btnWindows: "Download for Windows (W10+11)",
                btnText: "EN / DE",
                privacyPolicy: "Privacy Policy",
                legalNotice: "Legal notice"
            }
        };

        let currentLang = 'de';

        function toogleLanguage() {
            currentLang = currentLang === 'de' ? 'en' : 'de';
            const t = translations[currentLang];

            document.documentElement.lang = currentLang;

            document.getElementById('downloadTitle').textContent = t.title;
            document.getElementById('downloadDesc').textContent = t.desc;
            document.getElementById('downloadBtnAndroid').textContent = t.btnAndroid;
            document.getElementById('downloadBtnWindows').textContent = t.btnWindows;
            document.getElementById('langToogleBtn').textContent = t.btnText;

            const footerLinks = document.querySelectorAll('.footer-right a');
            if (footerLinks.length >= 2) {
                footerLinks[0].textContent = t.privacyPolicy;
                footerLinks[1].textContent = t.legalNotice;
            }
        }
    </script>
</body>
</html>
